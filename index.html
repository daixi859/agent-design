<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf9f5" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Pi Studio</title>
    <script>
      // 主题与语言在首帧前确定，避免闪烁（Q4：浅色验收、深色同套 token；ADR-0011：默认跟随浏览器语言）
      (function () {
        var stored = localStorage.getItem("pi-studio-theme");
        var theme =
          stored === "light" || stored === "dark"
            ? stored
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = theme;
        var storedLocale = localStorage.getItem("pi-studio-locale");
        var locale =
          storedLocale === "zh" || storedLocale === "en"
            ? storedLocale
            : (navigator.language || "").toLowerCase().indexOf("zh") === 0
              ? "zh"
              : "en";
        document.documentElement.lang = locale === "zh" ? "zh-CN" : "en";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
